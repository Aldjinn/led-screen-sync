# GitHub Actions workflow for Go test
name: Go Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# The tests only need to read the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          
      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: go test -v ./...
